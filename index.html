<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thịnh Phát Chinese Learning</title><style>
:root{--green:#247c70;--deep:#20574e;--mint:#e2f2e9;--bg:#f7faf6;--muted:#71857c;--line:#dce9e0;--amber:#fff1d7;--red:#c54343}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#294a41;font:15px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{display:flex;min-height:100vh}.sidebar{width:238px;background:#e9f3ed;padding:24px 16px;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--deep);font-size:19px}.brand small{display:block;font-size:10px;letter-spacing:1.4px;color:var(--muted)}.logo{background:var(--green);color:white;border-radius:13px;padding:11px}.nav{display:grid;gap:6px;margin-top:35px}.nav button,.mobile-nav button{border:0;background:transparent;text-align:left;color:#48685e;padding:13px;border-radius:12px}.nav button.active,.mobile-nav button.active{background:#cfe7d9;color:var(--deep);font-weight:700}.main{flex:1;min-width:0;padding:24px clamp(15px,3vw,46px);max-width:1400px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.top-actions{display:flex;align-items:center;gap:10px}.pill{border:1px solid var(--line);border-radius:30px;padding:7px 12px;background:white}.hero{background:linear-gradient(120deg,#dceee3,#edf7ed);border-radius:22px;padding:28px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{font-size:clamp(22px,3vw,32px);margin:0 0 7px}.muted{color:var(--muted)}.progress{background:#c7dfd2;height:9px;border-radius:20px;overflow:hidden}.progress>div{background:var(--green);height:100%;border-radius:20px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px}.course{cursor:pointer;transition:.2s}.course:hover{transform:translateY(-3px);box-shadow:0 8px 22px #20574e14}.course h3{margin:9px 0 2px}.course .emoji{font-size:28px}.section-title{margin:27px 0 12px;display:flex;justify-content:space-between;align-items:center}.btn{background:var(--green);border:0;color:white;padding:10px 16px;border-radius:11px;font-weight:650}.btn.secondary{background:#e3f1e9;color:var(--deep)}.btn.outline{background:white;border:1px solid #bad9cb;color:var(--deep)}.btn.danger{background:#fff0f0;color:var(--red)}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:18px}.stat strong{font-size:26px;display:block}.layout{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:20px}.lesson-list{display:grid;gap:10px}.lesson-item{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.tag{display:inline-block;background:#e2f2e9;color:#276b57;border-radius:25px;padding:3px 9px;font-size:12px}.tag.red{background:#ffebeb;color:#b43e3e}.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:7px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:white;padding:10px 13px;border-radius:11px}.tabs button.active{background:var(--green);color:white}.video{background:#173b35;aspect-ratio:16/9;border-radius:16px;overflow:hidden;display:grid;place-items:center;color:white}.video video{width:100%;height:100%;object-fit:contain}.flashcard{background:#edf7f0;border:1px solid #c9e5d6;border-radius:18px;padding:35px;text-align:center;cursor:pointer;min-height:230px;display:grid;place-content:center}.hanzi{font-size:48px;font-weight:600}.choice{display:block;border:1px solid var(--line);background:white;padding:13px;border-radius:11px;margin:8px 0;cursor:pointer}.choice:has(input:checked){border-color:var(--green);background:#eaf6ef}.notice{padding:14px;border-radius:12px;background:#eaf5ed;margin-top:12px}.notice.red{background:#fff0ef;color:#9d3535}.mobile-nav{display:none}.field{display:grid;gap:5px;margin:12px 0}.field input,.field select,.field textarea{padding:10px;border:1px solid #c9d9cf;border-radius:10px;background:white;width:100%}textarea{min-height:80px}.hidden{display:none!important}.mini{font-size:12px}.footer{margin-top:30px;color:var(--muted);font-size:12px}.admin-table{width:100%;border-collapse:collapse}.admin-table td,.admin-table th{text-align:left;border-bottom:1px solid var(--line);padding:11px 7px}.scroll{overflow:auto}.score{font-size:36px;font-weight:800;color:var(--green)}.score.low{color:var(--red)}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:760px){.sidebar{display:none}.main{padding:15px 13px 85px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:14px}.hero{padding:19px}.hero .illustration{display:none}.stats{grid-template-columns:repeat(2,1fr)}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);z-index:20;justify-content:space-around;padding:6px}.mobile-nav button{font-size:11px;padding:8px 5px;text-align:center}.mobile-nav button span{display:block;font-size:20px}.top .brand{font-size:15px}.top .brand small{font-size:8px}.top-actions{font-size:12px}.pill{padding:6px}.section-title h2{font-size:19px}}
 .brand-image{width:52px;height:52px;object-fit:contain;background:white;border-radius:50%;padding:3px;border:1px solid #e5eee6}.sidebar .brand-image{width:58px;height:58px}.icon-speed{font-size:34px;min-width:76px;min-height:70px;display:inline-flex;align-items:center;justify-content:center}.login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#e2f2e9,#f8faf5);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.login-box{width:min(440px,100%);background:white;border-radius:22px;padding:28px;box-shadow:0 12px 50px #20574e22}.login-box img{display:block;width:115px;height:115px;object-fit:contain;margin:auto}.login-box h2{text-align:center;color:#20574e}.login-box .btn{width:100%}.login-note{font-size:12px;color:#697f74;background:#edf6ef;padding:12px;border-radius:10px;margin-top:15px}.vocab-levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:18px 0}.vocab-levels button{padding:17px 8px;border:1px solid #c7e4d3;border-radius:15px;background:white;color:#247c70;font-weight:800}.vocab-levels button.selected{background:#247c70;color:white}.account-only{max-width:680px}@media(max-width:760px){.vocab-levels{grid-template-columns:repeat(3,1fr)}.brand-image{width:40px;height:40px}.top-actions .pill{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}} 
.admin-overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}
.admin-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.admin-action{border:1px solid var(--line);border-radius:16px;background:white;padding:20px;text-align:left;display:grid;gap:7px;color:var(--deep);transition:.2s}
.admin-action:hover{border-color:var(--green);box-shadow:0 8px 22px #20574e15}
.admin-action small{color:var(--muted);font-size:12px}
.admin-permission-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.admin-check{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px;background:#f8fbf8}
@media(max-width:900px){.admin-overview{grid-template-columns:repeat(2,1fr)}.admin-actions{grid-template-columns:repeat(2,1fr)}}
@media(max-width:550px){.admin-actions{grid-template-columns:1fr}.admin-permission-grid{grid-template-columns:repeat(2,1fr)}}

 ${[['studentsAdmin','👥','Học viên','Duyệt đăng ký và phân quyền HSK'],['editor','📚','Khóa học & bài giảng','Soạn nội dung HSK1–HSK5'],['testsAdmin','📝','Bài tập & kiểm tra','Quản lý đề và đáp án'],['scoresAdmin','📊','Kết quả học tập','Theo dõi tiến độ và điểm số'],['noticesAdmin','🔔','Thông báo','Thông báo theo khóa học'],['settingsAdmin','⚙','Cài đặt','Tài khoản và phân quyền']].map(x=>`<button class="admin-action" onclick="go('${x[0]}')"><span style="font-size:27px">${x[1]}</span><b>${x[2]}</b><small>${x[3]}</small></button>`).join('')}
 </div>`;
}
function studentsAdminPage(){
 const people=adminStudents;
 return `<h1>👥 Quản lý học viên</h1><p class="muted">Danh sách hồ sơ thực tế từ Firebase Firestore. Chỉ Admin mới có thể cấp hoặc thu hồi quyền học.</p>
 <div class="card"><div class="row between" style="flex-wrap:wrap"><h3 style="margin:0">Danh sách học viên (${people.length})</h3><button class="btn secondary" onclick="loadAdminStudents()">↻ Tải lại Firebase</button></div>
 ${studentsLoading?'<p>Đang tải dữ liệu...</p>':''}${studentsError?`<p class="notice red">${esc(studentsError)}</p>`:''}
 <div class="row" style="flex-wrap:wrap;margin-top:14px"><input id="studentSearch" placeholder="🔎 Tìm tên hoặc email..." oninput="filterAdminStudents()" style="flex:1;min-width:180px;padding:10px;border:1px solid var(--line);border-radius:10px"><select id="studentLevelFilter" onchange="filterAdminStudents()" style="padding:10px;border:1px solid var(--line);border-radius:10px"><option value="">Tất cả khóa</option>${[1,2,3,4,5].map(i=>`<option>HSK${i}</option>`).join('')}</select></div>
 <div class="scroll"><table class="admin-table"><thead><tr><th>Học viên</th><th>Trạng thái</th><th>Khóa được cấp</th><th>Thao tác</th></tr></thead><tbody id="adminStudentsRows">${people.length?people.map((u,i)=>`<tr data-name="${esc((u.name+' '+u.email).toLowerCase())}" data-courses="${esc((u.enrolledCourses||[]).join(','))}"><td><b>${esc(u.name||'Chưa có tên')}</b><div class="mini muted">${esc(u.email||u.id)}</div></td><td><span class="tag ${u.status==='active'?'':'red'}">${u.status==='active'?'Đang học':u.status==='pending'?'Chờ duyệt':esc(u.status||'Chưa duyệt')}</span></td><td>${esc((u.enrolledCourses||[]).join(', ')||'Chưa cấp')}</td><td><button class="btn secondary" onclick="editStudentAccess(${i})">Cấp quyền</button></td></tr>`).join(''):'<tr><td colspan="4">Chưa có học viên hoặc chưa tải dữ liệu.</td></tr>'}</tbody></table></div></div>
 <div id="studentPermissionEditor" class="card" style="margin-top:16px"><p>Chọn <b>Cấp quyền</b> ở một học viên để chỉnh sửa trạng thái và các khóa HSK được phép học.</p></div>
 <p class="muted mini">Tài khoản đăng nhập cần tồn tại trong Firebase Authentication. Trang này quản lý hồ sơ và quyền học; chức năng tạo tài khoản mới sẽ làm ở bước sau.</p>`;
}
let editingStudentId=null;
async function loadAdminStudents(){
 if(currentUser!=='admin')return;studentsLoading=true;studentsError='';if(page==='studentsAdmin')render();
 try{const snapshot=await getDocs(collection(db,'students'));adminStudents=snapshot.docs.map(d=>({id:d.id,...d.data()}));}
 catch(e){console.error(e);studentsError='Không thể đọc danh sách học viên. Kiểm tra tài khoản Admin và Firestore Rules.';}
 finally{studentsLoading=false;if(page==='studentsAdmin')render();}
}
function editStudentAccess(i){
 const u=adminStudents[i];if(!u)return;editingStudentId=u.id;
 const chosen=Array.isArray(u.enrolledCourses)?u.enrolledCourses:[];
 $('#studentPermissionEditor').innerHTML=`<h3>Cấp quyền: ${esc(u.name||u.email||u.id)}</h3><p class="muted mini">${esc(u.email||'')} · Mã UID: ${esc(u.id)}</p>
 <label class="field">Trạng thái<select id="studentStatus"><option value="pending" ${u.status!=='active'?'selected':''}>Chờ duyệt (khóa tất cả)</option><option value="active" ${u.status==='active'?'selected':''}>Đang học (đã duyệt)</option></select></label>
 <p><b>Các khóa được phép học</b></p><div class="admin-permission-grid">${[1,2,3,4,5].map(n=>`<label class="admin-check"><input type="checkbox" class="student-course-check" value="HSK${n}" ${chosen.includes('HSK'+n)?'checked':''}> HSK${n}</label>`).join('')}</div>
 <div class="row" style="margin-top:14px;flex-wrap:wrap"><button class="btn secondary" onclick="setStudentCourseSelection(['HSK1','HSK2','HSK3'])">Combo HSK123</button><button class="btn outline" onclick="setStudentCourseSelection([])">Bỏ chọn</button><button class="btn" id="saveStudentAccessBtn" onclick="saveStudentAccess()">Lưu quyền vào Firebase</button></div>
 <div id="studentAccessFeedback" class="mini muted" style="margin-top:12px">Chỉ cấp quyền cho khóa học đã được trung tâm xác nhận.</div>`;
 $('#studentPermissionEditor').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function setStudentCourseSelection(courses){document.querySelectorAll('.student-course-check').forEach(x=>x.checked=courses.includes(x.value))}
async function saveStudentAccess(){
 if(currentUser!=='admin'||!editingStudentId)return;
 const status=$('#studentStatus').value, enrolledCourses=[...document.querySelectorAll('.student-course-check:checked')].map(x=>x.value);
 const btn=$('#saveStudentAccessBtn');btn.disabled=true;const feedback=$('#studentAccessFeedback');feedback.textContent='Đang lưu...';
 try{await updateDoc(doc(db,'students',editingStudentId),{status,enrolledCourses,updatedAt:serverTimestamp()});feedback.textContent='✓ Đã lưu quyền vào Firebase.';await loadAdminStudents();}
 catch(e){console.error(e);feedback.textContent='Không lưu được. Kiểm tra Firestore Rules và kết nối mạng.';btn.disabled=false;}
}
function canAccessCourse(id){return currentUser==='admin'||(studentAccess.status==='active'&&studentAccess.enrolledCourses.includes('HSK'+Number(id)))}
function deniedCoursePage(){return `<div class="card"><h2>🔒 Khóa học chưa được cấp quyền</h2><p>Bạn chỉ có thể học những khóa HSK đã đăng ký và được trung tâm duyệt.</p><button class="btn secondary" onclick="go('home')">Về trang chủ</button></div>`}
function filterAdminStudents(){let q=($('#studentSearch')?.value||'').trim().toLowerCase(),level=$('#studentLevelFilter')?.value||'';document.querySelectorAll('#adminStudentsRows tr').forEach(r=>{r.style.display=(!q||r.dataset.name?.includes(q))&&(!level||r.dataset.courses?.split(',').includes(level))?'':'none'})}
function showPermissionDemo(){document.querySelector('.admin-permission-grid')?.scrollIntoView({behavior:'smooth',block:'center'})}
function choosePermissionDemo(levels){document.querySelectorAll('.permission-demo').forEach(el=>el.checked=levels.includes(Number(el.value.replace('HSK',''))));updatePermissionDemo()}
function updatePermissionDemo(){let levels=[...document.querySelectorAll('.permission-demo:checked')].map(x=>x.value);$('#permissionPreview').textContent=levels.length?'🔓 Bản xem thử sẽ mở: '+levels.join(', '):'🔒 Chưa chọn khóa học nào.'}
function testsAdminPage(){return `<h1>📝 Bài tập & kiểm tra</h1>${adminNotice()}<div class="card"><h3>Quản lý đề HSK</h3><p>Soạn câu hỏi trắc nghiệm và đáp án trong mục Khóa học & bài giảng hiện tại.</p><button class="btn" onclick="go('editor')">Mở trình soạn bài</button><p class="muted mini">Chấm điểm toàn trung tâm và giao đề riêng sẽ được kết nối ở bước tiếp theo.</p></div>`}
function scoresAdminPage(){return `<h1>📊 Kết quả học tập</h1>${adminNotice()}<div class="card"><h3>Theo dõi kết quả học viên</h3><p>Thiết kế dự kiến: học viên, khóa HSK, số bài hoàn thành, điểm gần nhất và cảnh báo dưới 55/100.</p><p class="muted">Chưa thể tổng hợp điểm thực tế khi chưa đồng bộ dữ liệu học viên lên Firestore.</p><button class="btn secondary" onclick="go('alerts')">Xem cảnh báo dữ liệu mẫu</button></div>`}
function noticesAdminPage(){return `<h1>🔔 Thông báo</h1>${adminNotice()}<div class="card"><h3>Soạn thông báo</h3><label class="field">Gửi đến<select disabled><option>Tất cả học viên</option></select></label><label class="field">Tiêu đề<input disabled placeholder="Ví dụ: Lịch thi thử HSK"></label><label class="field">Nội dung<textarea disabled placeholder="Nội dung thông báo..."></textarea></label><button class="btn" disabled>Gửi thông báo (chưa kích hoạt)</button><p class="muted mini">Cần kết nối Firestore trước khi gửi thông báo thật.</p></div>`}
function settingsAdminPage(){return `<h1>⚙ Cài đặt</h1><div class="card"><h3>Tài khoản quản trị</h3><p>Quyền quản trị được xác minh qua Firebase Authentication Custom Claims.</p><p><span class="tag">Admin đang đăng nhập</span></p><p class="muted mini">Không chia sẻ mật khẩu. Việc cấp hoặc thu hồi quyền Admin phải thực hiện ở môi trường quản trị an toàn, không từ mã nguồn công khai.</p></div>${adminNotice()}`}
function alertsPage(){return `<h1>⚠ Danh sách học viên cần hỗ trợ</h1><p class="muted">Mỗi bài có điểm dưới 55/100 tạo một cảnh báo để quản lý phân công giáo viên.</p>${state.alerts.length?state.alerts.map((a,i)=>`<div class="card" style="margin-bottom:12px"><div class="row between"><h3>${esc(state.users[a.userId]?.name)} · HSK ${a.courseId}</h3><span class="tag ${a.status==='new'?'red':''}">${a.status==='new'?'Chưa xử lý':'Đã tiếp nhận'}</span></div><p>Bài: ${esc(allLessons().find(l=>l.id===a.lessonId)?.title||a.lessonId)} · <b style="color:var(--red)">${a.score}/100</b></p><p class="muted mini">${new Date(a.at).toLocaleString('vi-VN')}</p><label class="field">Ghi chú giáo viên / quản lý<textarea id="note${i}" placeholder="Ví dụ: Cần kèm lại phần từ vựng...">${esc(a.note)}</textarea></label><button class="btn" onclick="saveAlert(${i})">Lưu ghi chú và đánh dấu đã tiếp nhận</button></div>`).join(''):'<div class="card">Chưa có cảnh báo.</div>'}`}
function saveAlert(i){state.alerts[i].note=$('#note'+i).value;state.alerts[i].status='ack';save();render()}
function editorPage(){return `<h1>✎ Quản lý nội dung HSK1–HSK5</h1><p class="muted">Chức năng xuất bản bài học lên Firebase chưa được kết nối; chưa sử dụng để đăng bài chính thức.</p><div class="card"><h3>Thêm bài mới</h3><label class="field">Cấp độ<select id="editCourse">${state.courses.map(c=>`<option value="${c.id}">${c.title}</option>`).join('')}</select></label><label class="field">Tên bài<input id="editTitle" placeholder="Ví dụ: 你叫什么名字？"></label><label class="field">Link video MP4 (HTTPS)<input id="editVideo" placeholder="https://.../video.mp4"></label><label class="field">Từ vựng (mỗi dòng: chữ Hán | pinyin | nghĩa | ví dụ)<textarea id="editVocab" placeholder="你好 | nǐ hǎo | Xin chào | 你好！"></textarea></label><label class="field">Ngữ pháp<textarea id="editGrammar"></textarea></label><label class="field">Hội thoại luyện nghe<textarea id="editListening" placeholder="你好！你叫什么名字？"></textarea></label><label class="field">Câu hỏi trắc nghiệm (mỗi dòng: câu hỏi | A | B | C | đáp án 1/2/3 | giải thích)<textarea id="editQuestions" placeholder="你好 nghĩa là gì? | Xin chào | Cảm ơn | Tạm biệt | 1 | 你好 nghĩa là xin chào."></textarea></label><button class="btn" onclick="addLesson()">+ Lưu bài giảng mẫu</button></div><div class="section-title"><h2>Nội dung hiện có</h2></div><div class="lesson-list">${state.courses.map(c=>`<div class="card"><b>${c.title}</b><p class="muted">${c.lessons.length} bài: ${c.lessons.map(l=>esc(l.title)).join('; ')||'Chưa có'}</p></div>`).join('')}</div><div class="notice">Lưu ý: Dữ liệu nhập tại đây không tự xuất hiện trên máy của học viên khác. Để giáo viên đăng bài cho toàn bộ học viên, cần cơ sở dữ liệu và đăng nhập có phân quyền.</div>`}
function addLesson(){let cid=Number($('#editCourse').value),title=$('#editTitle').value.trim(),video=$('#editVideo').value.trim();if(!title){alert('Vui lòng nhập tên bài.');return}if(video&&!/^https:\/\//i.test(video)){alert('Đường dẫn video cần bắt đầu bằng https://');return}let vocab=$('#editVocab').value.split('\n').filter(x=>x.trim()).map(x=>{let p=x.split('|').map(s=>s.trim());return {hanzi:p[0]||'',pinyin:p[1]||'',meaning:p[2]||'',example:p[3]||''}});let questions=$('#editQuestions').value.split('\n').filter(x=>x.trim()).map(x=>{let p=x.split('|').map(s=>s.trim());return {type:'choice',prompt:p[0]||'',options:[p[1]||'',p[2]||'',p[3]||''],answer:Math.max(0,Math.min(2,(Number(p[4])||1)-1)),explain:p[5]||''}}).filter(q=>q.prompt&&q.options.every(Boolean));let id='custom-'+Date.now();state.courses.find(c=>c.id===cid).lessons.push({id,title,video,vocab,grammar:$('#editGrammar').value,listeningText:$('#editListening').value,questions});save();alert('Đã lưu bài trên trình duyệt này.');render()}
